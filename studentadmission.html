<!-- Admission Form -->

<div class="admission-card">



<h2>
➕ Add New Student
</h2>




<input 
type="text"
id="studentName"
placeholder="Student Name">



<input 
type="tel"
id="parentPhone"
placeholder="WhatsApp Number">





<input 
type="text"
id="schoolName"
placeholder="School Name or institute name">






<select id="studentClass">


<option value="">
Select Class
</option>


</select>

<button 
onclick="addStudent()">

💾 Save Student

</button>




</div>






<!-- Student List -->

<h2>
📋 Student List
</h2>




<table>


<thead>

<th>
No
</th>


<th>
Name
</th>


<th>

</th>


<th>

</th>

</th>


</tr>


</thead>

</tbody>
