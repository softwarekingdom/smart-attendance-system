<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Attendance History
</title>


<link rel="stylesheet" href="sidebar.css">

<link rel="stylesheet" href="attendancehistory.css">


</head>



<body class="attendance-history-body">


<button 
class="menu-btn"
onclick="toggleSidebar()">

☰

</button>



<div class="overlay"
onclick="closeSidebar()">

</div>




<div class="container">



<h1>
📅 Attendance History
</h1>





<div class="filter-box">



<select id="historyClass"
onchange="loadHistory()">

<option value="">
All Classes
</option>


</select>





<input 
type="date"
id="historyDate"
onchange="loadHistory()">





<button onclick="clearFilters()">

Clear

</button>



</div>








<div class="summary-box">



<div class="summary-card">

<h3>
✅ Present
</h3>

<h1 id="presentTotal">
0
</h1>

</div>





<div class="summary-card">

<h3>
❌ Absent
</h3>

<h1 id="absentTotal">
0
</h1>

</div>






<div class="summary-card">

<h3>
👨‍🎓 Total
</h3>

<h1 id="studentTotal">
0
</h1>

</div>



</div>








<div class="history-card">



<h2>
📋 Attendance Report
</h2>



<table>


<thead>


<tr>


<th>
Date
</th>


<th>
Class
</th>


<th>
Student
</th>


<th>
Status
</th>


<th>
Action
</th>


</tr>


</thead>




<tbody id="historyList">


</tbody>



</table>



</div>




</div>





<script src="sidebar.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="attendancehistory.js"></script>


</body>


</html>
